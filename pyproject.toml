[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "md2pdf-weasy"
version = "0.4.0"
description = "Markdown to PDF via WeasyPrint with YAML front-matter control"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Jimmy Harris" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Printing",
]
dependencies = [
    # WeasyPrint 63.1-69 can double-release Fontconfig state with Pango 1.54+,
    # causing intermittent native crashes during garbage collection or exit.
    # Version 70 contains the upstream lifetime fix.
    "weasyprint>=70",
    "markdown>=3.4",
    "pymdown-extensions>=10.0",
    "pyyaml>=6.0",
    # Width fitting reads bundled OTF metrics directly. Keep this explicit
    # rather than relying on WeasyPrint's transitive dependency.
    "fonttools>=4.59.2",
    # Visual acceptance opens and verifies every Poppler PNG directly.
    "pillow>=10",
    # Visual acceptance rejects active/embedded PDF objects before Poppler.
    "pypdf>=5",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
md2pdf = "pdf.render:main"

[tool.setuptools.packages.find]
include = ["pdf*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
pdf = ["fonts/*.ttf", "fonts/*.otf", "styles/*.css", "default_widths.yml", "table_presets.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
