[project]
name = "md2pdf-weasy"
version = "0.1.0"
description = "Markdown to PDF via WeasyPrint with YAML front-matter control"
requires-python = ">=3.11"
dependencies = [
    "weasyprint",
    "markdown>=3.4",
    "pyyaml>=6.0",
]

[project.scripts]
md2pdf = "pdf.render:main"

[tool.setuptools.package-dir]
pdf = "."

[tool.setuptools.package-data]
pdf = ["fonts/*.ttf", "styles/*.css"]
