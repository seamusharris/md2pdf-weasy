# Default column widths by header name.
#
# When a layout in tables.yml (or document front matter) declares columns
# without explicit widths, the pipeline looks up the header name here.
# Widths are unitless relative weights — PDF normalises to 100% of table
# width, XLSX uses them directly as character widths.
#
# Lookup is case-insensitive on the header text. Columns whose headers
# aren't in this file get the fallback width below.
#
# Tune the numbers by editing this file. Per-project tables.yml can
# always override these defaults by setting `width:` explicitly on a
# column.

fallback: 15   # unknown header → medium-width default


# ── Very narrow: single-letter / 1-2 digit numeric columns ─────────────
# (Sport stats, ranks, levels, IDs)
widths:
  "#":           6
  "No.":         6
  "ID":          6
  "Level":       6
  "Rank":        6
  "Pos":         6
  "Pos.":        6
  "RPE":         6
  "P":           6
  "W":           6
  "L":           6
  "D":           6
  "%":           6
  "GF":          7
  "GA":          7
  "Pts":         6
  "Score":      10
  "Margin":      8

  # ── Narrow: short labels, time/date, weekly identifiers ──────────────
