[project]
name = "md2pdf-weasy"
version = "0.1.0"
description = "Markdown to PDF via WeasyPrint with YAML front-matter control"
requires-python = ">=3.11"
dependencies = [
    "weasyprint",
    "markdown>=3.4",
    "pymdown-extensions>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
md2pdf = "pdf.render:main"

[tool.setuptools.packages.find]
include = ["pdf*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
pdf = ["fonts/*.ttf", "fonts/*.otf", "styles/*.css", "default_widths.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
