[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "md2pdf-weasy"
version = "0.3.0"
description = "Markdown to PDF via WeasyPrint with YAML front-matter control"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Jimmy Harris" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Printing",
]
dependencies = [
    # style.css uses table:has(colgroup) and leader()/target-counter, which
    # need a reasonably modern WeasyPrint.
    "weasyprint>=60",
    "markdown>=3.4",
    "pymdown-extensions>=10.0",
    "pyyaml>=6.0",
    # Width fitting reads bundled OTF metrics directly. Keep this explicit
    # rather than relying on WeasyPrint's transitive dependency.
    "fonttools>=4.59.2",
    # Visual acceptance opens and verifies every Poppler PNG directly.
    "pillow>=10",
    # Visual acceptance rejects active/embedded PDF objects before Poppler.
    "pypdf>=5",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
md2pdf = "pdf.render:main"

[tool.setuptools.packages.find]
include = ["pdf*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
pdf = ["fonts/*.ttf", "fonts/*.otf", "styles/*.css", "default_widths.yml", "table_presets.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
